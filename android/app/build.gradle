plugins {
    id "com.android.application"
}

android {
    namespace "org.zquestclassic.android"
    compileSdk 35
    ndkVersion "27.3.13750724"

    defaultConfig {
        applicationId "org.zquestclassic.android"
        minSdk 23
        targetSdk 35
        versionCode 2026111913
        versionName "0.1.0-alpha"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                targets "zplayer"
                arguments "-DANDROID_STL=c++_shared",
                          "-DWANT_NFD=OFF",
                          "-DWANT_ZUPDATER=OFF",
                          "-DWANT_WEBSOCKETS=OFF",
                          "-DWANT_ZC_TESTS=OFF"
            }
        }
    }

    sourceSets {
        main {
            // The runtime expects its standard resources directory beside its
            // config and save files. MainActivity copies these assets into the
            // app's private files directory on first launch.
            assets.srcDirs = ["../../resources"]
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.30.5"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    // The download should say "ZQuest Classic Mobile alpha" on the tin, not
    // a Gradle-default "app-debug.apk".
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "ZQuestClassicMobile-${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation files("libs/allegro-release.aar")
}
