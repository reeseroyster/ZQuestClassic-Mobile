name: Build Android APK

# Builds the debug APK so every contribution gets a real check. Uses only the
# built-in GITHUB_TOKEN — no secrets, nothing published automatically.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub ubuntu-latest ships an Android SDK; just point at it. (The
      # android-actions/setup-android action fails here — it tries to install
      # the legacy "tools" package that Google removed from the SDK repo.)
      - name: Set up Android SDK (runner-provided)
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}" >> "$GITHUB_ENV"
          dirname "$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f -print -quit)" >> "$GITHUB_PATH"

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" \
            "platform-tools" "ndk;27.3.13750724" "cmake;3.30.5"

      - name: Build Allegro AAR (arm64-v8a)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          export PATH="$ANDROID_HOME/cmake/3.30.5/bin:$PATH"
          cmake -G Ninja -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DWANT_NFD=OFF -DWANT_ZUPDATER=OFF -DWANT_WEBSOCKETS=OFF -DWANT_ZC_TESTS=OFF
          cmake --build build-android --target aar -j2
          mkdir -p android/app/libs
          AAR="$(find build-android -name allegro-release.aar | head -1)"
          test -n "$AAR" || { echo "allegro-release.aar was not produced"; exit 1; }
          cp "$AAR" android/app/libs/allegro-release.aar

      - name: Assemble debug APK
        run: |
          cd android
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZQuestClassicMobile-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
